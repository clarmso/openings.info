name: Generate Pages

# Builds docs/index.html and docs/companies.html from whatever's already in
# data/ and state/open_jobs/ (no crawling). Normally dispatched automatically
# by crawl.yml after new data lands, but can also be run manually to test
# HTML/CSS changes against the existing crawl data without re-crawling every
# job board.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Generate new jobs manifest
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: python scripts/generate_new_jobs.py

      - name: Generate companies page
        run: python scripts/generate_companies_page.py

      - name: Commit changes
        id: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/canada_ai_cache.json docs/new_jobs.json docs/index.html docs/companies.json docs/companies.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "📄 generate: $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A GITHUB_TOKEN-authenticated push above does NOT trigger other
      # workflows' `on: push` (GitHub's loop-prevention rule), so Deploy
      # Pages must be dispatched explicitly here when docs/ changed.
      - name: Trigger Pages deployment
        if: always() && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
