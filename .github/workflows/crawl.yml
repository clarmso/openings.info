name: Crawl Job Boards

on:
  schedule:
      # 03:00 UTC Tue-Sat = 8:00 PM Mon-Fri Pacific (PDT) / 7:00 PM (PST).
      # GitHub Actions cron is always UTC and doesn't shift for daylight
      # saving, so day-of-week is Tue-Sat (2-6) to land on Mon-Fri Pacific.
      - cron: '0 3 * * 2-6'
  workflow_dispatch:       # Allow manual trigger

permissions:
  contents: write
  actions: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run crawler
        run: python crawl.py

      - name: Commit changes
        id: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ state/open_jobs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "🦀 crawl: $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A GITHUB_TOKEN-authenticated push above does NOT trigger other
      # workflows' `on: push` (GitHub's loop-prevention rule), so page
      # generation must be dispatched explicitly here when data/ changed.
      - name: Trigger page generation
        if: always() && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run generate.yml --ref main